<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
   <h1 id="heading">Weather Details</h1> 
   <section class="information">
    <h3 id="guide">Enter Your Location</h3>
    <div class="searchbar">
    <input type="search" name="searchInfo" id="search-info" placeholder="e.g Kathmandu">
    <button type="submit" id="btn">Enter</button>
</div>
   </section>
   <h2 id="showCity">Search a city</h2>
   <section class="more-details">
    <h3 class="depth">
      Wind
      <span id="wind">--</span>
    </h3>
    <h3 class="depth"> 
      Rain perception
      <span id="Rain">--</span>
    </h3>
    <h3 class="depth">
      Humidity
      <span id="humidity">--</span>
    </h3>
   </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
