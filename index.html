<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
   <h1 id="heading">Weather Details</h1> 
   <section class="information">
    <h3 id="guide">Enter Your Location</h3>
    <div class="searchbar">
    <select name="location" id="search-info">

      <option value="" disabled selected >Select a location</option>
      <option value="Kathmandu" class="drop">Kathmandu</option>
      <option value="London" class="drop">London</option>
      <option value="New delhi" class="drop">New Delhi</option>
      <option value="Dhaka" class="drop">Dhaka</option>
    </select>
</div>
   </section>
   <h2 id="showCity">Search a city</h2>
   <section class="more-details">
    <h3 class="depth">
      Wind
      <span id="wind">--</span>
    </h3>
    <h3 class="depth"> 
      Condition
      <span id="condition">--</span>
    </h3>
    <h3 class="depth">
      Rain Chance
      <span id="rainChance">--</span>
    </h3>
   </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
